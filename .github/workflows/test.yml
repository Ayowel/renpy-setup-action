# Based on actions/reusable-workflows/.github/workflows/basic-validation.yml
name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
      - releases/*
    tags:
      - v*
    paths:
      - 'src/**'
      - 'package*.json'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'tsconfig.json'

env:
  NODE_VERSION: 24.x
  ANDROID_NDK_HOME: ""

jobs:
  test:
    runs-on: ${{ matrix.operating-systems }}
    strategy:
      fail-fast: false
      matrix:
        operating-systems:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        id: test-cache
        with:
          path: test_cache
          key: ${{ runner.os }}-test-cache

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Java 8
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '8'

      - name: "Save Java 8 path as env for tests"
        run: echo "JAVA_HOME8=${JAVA_HOME}" >> "${GITHUB_ENV}"

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: "Save Java 21 path as env for tests"
        run: echo "JAVA_HOME21=${JAVA_HOME}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run prettier
        run: npm run format-check

      - name: Run linter
        run: npm run lint

      - name: Audit packages
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          files: coverage/clover.xml
          flags: unittests, ${{ matrix.operating-systems }}
