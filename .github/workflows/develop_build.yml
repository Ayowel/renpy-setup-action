name: Build testing

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'package*.json'
      - 'tsconfig.json'

env:
  NODE_VERSION: 24.x

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run-script prerelease

      - name: Pre-emptively add build assets
        run: npm run-script release

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: testing
          commit_message: Build develop branch
          push_options: --force
          create_branch: true
